services:
  backend:
    build:
      context: ../../backend
    environment:
      APP_CODEFORCES_BASE_URL: http://mock-codeforces:8080/api
      APP_DIVISIONS_DIRECTORY: /app/data/divisions
      SPRING_DATA_REDIS_PASSWORD: load-test-only
    volumes:
      - ${LOAD_DATA_DIRECTORY:?Run through run.mjs}:/app/data/divisions
    depends_on:
      redis:
        condition: service_healthy
      mock-codeforces:
        condition: service_started
    networks: [load]

  front:
    build:
      context: ../../front
    volumes:
      - ../../front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1::80"]
    depends_on: [backend]
    networks: [load, probe]

  redis:
    image: redis:8.10.3-alpine
    command: [redis-server, --requirepass, load-test-only, --maxmemory, 64mb, --maxmemory-policy, noeviction, --save, "", --appendonly, "no"]
    mem_limit: 128m
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=load-test-only redis-cli ping | grep -qx PONG"]
      interval: 1s
      timeout: 2s
      retries: 20
    networks: [load]

  mock-codeforces:
    image: node:24-alpine
    command: [node, /app/mock-codeforces.mjs]
    volumes:
      - ./mock-codeforces.mjs:/app/mock-codeforces.mjs:ro
    ports: ["127.0.0.1::8080"]
    networks: [load, probe]

networks:
  load:
    internal: true
  probe:
