name: CI

permissions:
    contents: read

on:
    pull_request:
        branches:
            - main

jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            
            - name: set up JDK 25
              uses: actions/setup-java@v6
              with:
                  distribution: 'temurin'
                  java-version: '25'

            - name: Set up Gradle
              uses: gradle/gradle-build-action@v3

            - name: Set up divisons file
              run: cp -r ./.github/fixture/divisions ./data/

            - name: Test backend
              working-directory: ./backend
              run: ./gradlew test

    front:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            
            - name: set up Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: install dependencies
              working-directory: ./front
              run: npm ci

            - name: test
              working-directory: ./front
              run: npm test

            - name: type check
              working-directory: ./front
              run: npm run check

    docker-build:
        needs: [backend, front]
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Set up divisons file
              run: cp -r ./.github/fixture/divisions ./data/

            - name: Create temporary Redis secret
              run: |
                  umask 077
                  openssl rand -hex 32 | tr -d '\n' > redis_password.txt

            - name: Build Docker images
              run: docker compose --parallel 2 build backend front

            - name: Start Docker Compose
              timeout-minutes: 10
              run: docker compose up -d --no-build

            - name: Check Redis authentication
              run: |
                  test "$(docker compose exec -T redis redis-cli ping)" = 'NOAUTH Authentication required.'
                  docker compose exec -T redis sh -ec \
                    'export REDISCLI_AUTH="$(cat /run/secrets/redis_password)"; test "$(redis-cli ping)" = PONG'

            - name: Check Proxy Manager on port 81
              timeout-minutes: 3
              run: |
                  curl --noproxy '*' --fail --silent --show-error \
                    --retry 30 --retry-delay 2 --retry-all-errors \
                    --retry-max-time 150 --max-time 5 \
                    --output /tmp/proxy-manager.html \
                    http://127.0.0.1:81/

            - name: Check frontend on port 80
              timeout-minutes: 3
              run: |
                  curl --noproxy '*' --fail --silent --show-error \
                    --retry 30 --retry-delay 2 --retry-all-errors \
                    --retry-max-time 150 --max-time 5 \
                    --output /tmp/virter.html \
                    http://localhost/
                  grep -q 'Virter' /tmp/virter.html

            - name: Check backend through API proxy
              timeout-minutes: 3
              run: |
                  curl --noproxy '*' --fail --silent --show-error \
                    --retry 30 --retry-delay 2 --retry-all-errors \
                    --retry-max-time 150 --max-time 5 \
                    --output /tmp/virter-health.json \
                    http://localhost/api/health
                  grep -q '"backendStatus":200' /tmp/virter-health.json
                  grep -q '"redisStatus":200' /tmp/virter-health.json

            - name: Show container logs on failure
              if: ${{ failure() }}
              run: |
                  docker compose ps --all
                  docker compose logs --no-color --tail=200

            - name: Stop Docker Compose
              if: ${{ always() }}
              run: docker compose down --volumes --remove-orphans




