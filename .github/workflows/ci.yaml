name: CI

on:
    pull_request:
        branches:
            - main

jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            
            - name: set up JDK 25
              uses: actions/setup-java@v6
              with:
                  distribution: 'temurin'
                  java-version: '25'

            - name: Set up Gradle
              uses: gradle/gradle-build-action@v3

            - name: Set up divisons file
              run: cp ./.github/fixture/divisions/ ./data/divisions/

            - name: Build and test backend
              working-directory: ./backend
              run: ./gradlew build test

            - name: Upload backend build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: backend-jar
                  path: backend/build/libs/app.jar
                  if-no-files-found: error

    front:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            
            - name: set up Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: install dependencies
              working-directory: ./front
              run: npm install

            - name: test
              working-directory: ./front
              run: npm test

            - name: build
              working-directory: ./front
              run: npm run build

            - name: Upload frontend build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-build
                  path: frontend/build/
                  if-no-files-found: error

    docker:
        needs: [backend, front]
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Download backend build artifacts
              uses: actions/download-artifact@v8
              with:
                  name: backend-jar
                  path: ./backend/build/libs/

            - name: Download frontend build artifacts
              uses: actions/download-artifact@v8
              with:
                  name: frontend-build
                  path: ./front/build/

            - name: Set up divisons file
              run: cp ./.github/fixture/divisions/ ./data/divisions/
            
            - name: Build Docker backend image
              run: docker build -t backend:latest ./backend

            - name: Build Docker frontend image
              run: docker build -t frontend:latest ./front

            - name: Start Docker Compose
              timeout-minutes: 10
              run: docker compose up -d --build

            - name: Check Proxy Manager on port 81
              timeout-minutes: 3
              run: |
                  curl --noproxy '*' --fail --silent --show-error \
                    --retry 30 --retry-delay 2 --retry-all-errors \
                    --retry-max-time 150 --max-time 5 \
                    --output /tmp/proxy-manager.html \
                    http://127.0.0.1:81/

            - name: Check frontend on port 80
              timeout-minutes: 3
              run: |
                  curl --noproxy '*' --fail --silent --show-error \
                    --retry 30 --retry-delay 2 --retry-all-errors \
                    --retry-max-time 150 --max-time 5 \
                    --output /tmp/virter.html \
                    http://localhost/
                  grep -q 'Virter' /tmp/virter.html

            - name: Check backend through API proxy
              timeout-minutes: 3
              run: |
                  curl --noproxy '*' --fail --silent --show-error \
                    --retry 30 --retry-delay 2 --retry-all-errors \
                    --retry-max-time 150 --max-time 5 \
                    --output /dev/null \
                    http://localhost/api/actuator/health

            - name: Show container logs on failure
              if: ${{ failure() }}
              run: |
                  docker compose ps --all
                  docker compose logs --no-color --tail=200

            - name: Stop Docker Compose
              if: ${{ always() }}
              run: docker compose down --volumes --remove-orphans




